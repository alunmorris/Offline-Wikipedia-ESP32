[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bodmer/TFT_eSPI @ 2.5.43
board_build.partitions = huge_app.csv
build_flags =
    ; TFT_eSPI — ILI9341 variant 2 on HSPI, touch handled separately via XPT2046_Touchscreen
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_MOSI=13 -DTFT_MISO=12 -DTFT_SCLK=14 -DTFT_CS=15 -DTFT_DC=2 -DTFT_RST=-1
    -DTOUCH_CS=-1
    -DTFT_INVERSION_ON=1
    -DLOAD_GLCD=1 -DLOAD_FONT2=1 -DLOAD_FONT4=1 -DLOAD_GFXFF=1
    -DSPI_FREQUENCY=27000000

; ESP32-C3 + standalone 2.8" ILI9341/XPT2046/SD module (the common "red" module).
; The C3 has a single SPI peripheral, so TFT, SD and touch share SCK/MOSI/MISO
; with separate CS lines. Wiring (C3 DevKitM-1 / SuperMini):
;   SCK=4  MISO=5  MOSI=6   (module: SCK+T_CLK+SD_SCK, MISO+T_DO+SD_MISO, MOSI+T_DIN+SD_MOSI)
;   TFT_CS=7  TFT_DC=1  TFT_RST -> 3V3 (or EN)
;   SD_CS=10  TOUCH_CS=3  TOUCH_IRQ=8 (PENIRQ idles HIGH — safe on strapping pin 8)
;   Backlight=0 (or tie module LED pin to 3V3)
; Strapping pins avoided for external loads: GPIO2 (must be 1 at boot), GPIO9 (boot).
[env:c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bodmer/TFT_eSPI
board_build.partitions = huge_app.csv
extra_scripts = pre:fix_tft_c3.py
build_flags =
    ; TFT_eSPI — standalone modules use the plain ILI9341 driver, no inversion.
    ; If colours look inverted (white<->black), add -DTFT_INVERSION_ON=1 and/or
    ; switch to -DILI9341_2_DRIVER=1.
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_MOSI=6 -DTFT_MISO=5 -DTFT_SCLK=4 -DTFT_CS=7 -DTFT_DC=1 -DTFT_RST=-1
    -DTOUCH_CS=-1
    -DLOAD_GLCD=1 -DLOAD_FONT2=1 -DLOAD_FONT4=1 -DLOAD_GFXFF=1
    -DSPI_FREQUENCY=40000000
    ; Shared-bus SD wiring
    -DSD_CS=10 -DSD_MOSI=6 -DSD_MISO=5 -DSD_SCK=4
    -DSD_SPI_HZ=40000000
    ; XPT2046 on the shared hardware SPI bus instead of bit-bang
    -DTOUCH_USE_SHARED_SPI=1
    -DTOUCH_CS_PIN=3 -DTOUCH_IRQ_PIN=8
    -DTFT_BACKLIGHT_PIN=0
    ; Route Serial to USB CDC (native USB JTAG port) instead of hardware UART pins
    -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
